<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DaWiz · NHL Team</title>
<script>try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <nav class="nav" id="nav"></nav>
  <header>
    <h1>NHL</h1>
    <select id="team" class="filter" aria-label="NHL team"></select>
  </header>
  <div class="toolbar"><span id="summary" class="nhlsum">Loading…</span></div>
  <div class="card detail" id="roster"></div>
</main>
<script src="/common.js"></script>
<script>
// Every pool player on one NHL team, in the Teams page's table with an Owner column in place of Team. Reached by
// clicking any team logo; the team is in the URL (?team=EDM). Active players in draft-round order, then a Total
// row (active players only, like the owners' totals), then players on owners' benches.
let data;

function teamRoster(team) {
  const players = data.owners
    .flatMap((o) => o.players.filter((p) => p.team === team).map((p) => ({ ...p, owner: o.owner })))
    .sort((x, y) => (x.round ?? 99) - (y.round ?? 99) || x.owner.localeCompare(y.owner));
  const bench = new Map(); // a player can sit on several benches: one row, every owner listed
  for (const o of data.owners) for (const p of o.bench ?? []) if (p.team === team) {
    bench.set(p.id, { ...p, round: null, owners: [...(bench.get(p.id)?.owners ?? []), o.owner] });
  }
  const sum = (k) => players.reduce((n, p) => n + (p[k] ?? 0), 0);
  const gp = sum("gp");
  return {
    players, gp, g: sum("g"), a: sum("a"), tp: sum("tp"), ppg: gp ? sum("tp") / gp : 0,
    rm: Math.round(sum("rm") * 100) / 100, otp: sum("otp"), ogp: sum("ogp"),
    bench: [...bench.values()].sort((x, y) => x.name.localeCompare(y.name)),
  };
}

function render() {
  const team = $("#team").value;
  const r = teamRoster(team);
  const game = [...r.players, ...r.bench].find((p) => p.game)?.game;
  const n = r.players.length;
  $("#summary").innerHTML = `${logo(team, true)}<span>${team} · ${n} active player${n === 1 ? "" : "s"} · ${r.tp} TP${game ? ` ${gamePill(game)}` : ""}</span>`;
  $("#roster").innerHTML = n || r.bench.length
    ? rosterTable(r, true)
    : `<div class="empty">No owner has a ${team} player.</div>`;
}

$("#team").addEventListener("change", () => {
  history.replaceState(null, "", nhlUrl($("#team").value));
  render();
});

async function load() {
  try {
    const res = await fetch("/api/standings");
    if (!res.ok) throw new Error(res.status);
    data = await res.json();
    const want = new URLSearchParams(location.search).get("team")?.toUpperCase();
    const teams = new Set(data.owners.flatMap((o) => [...o.players, ...(o.bench ?? [])].map((p) => p.team)).filter(Boolean));
    if (want) teams.add(want); // a logo from a team no owner has (e.g. on Undrafted) still opens, with a note
    $("#team").innerHTML = [...teams].sort().map((t) => `<option>${t}</option>`).join("");
    $("#team").value = want ?? [...teams].sort()[0];
    render();
  } catch (e) {
    $("#summary").textContent = "";
    $("#roster").innerHTML = `<div class="empty" style="color:var(--worst)">Couldn't load the team. Try refreshing.</div>`;
  }
}
load();
</script>
</body>
</html>
