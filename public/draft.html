<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DaWiz · Draft</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <nav class="nav" id="nav"></nav>
  <header style="align-items:center">
    <h1>Draft</h1>
    <select id="owner" class="filter" aria-label="Filter by owner"><option value="">All owners</option></select>
  </header>
  <div id="rounds"></div>
</main>
<script src="/common.js"></script>
<script>
let picks = [];

function render() {
  const who = $("#owner").value;
  const shown = who ? picks.filter((p) => p.owner === who) : picks;
  const rounds = [...new Set(shown.map((p) => p.round))];
  $("#rounds").innerHTML = rounds.map((r) => `
    <div class="roundhead">Round ${r}</div>
    <div class="card">${shown.filter((p) => p.round === r).map((p) => `
      <div class="pick">
        <span class="num">${p.pick}</span>
        <a href="https://www.nhl.com/player/${p.id}" target="_blank" rel="noopener">${photo(p)}</a>
        <div class="pinfo">
          <a class="player" href="https://www.nhl.com/player/${p.id}" target="_blank" rel="noopener"><b>${p.name}</b></a>
          <span class="pmeta">${logo(p.team)}${p.team ?? "—"} · ${p.pos}${price(p.cost)}</span>
        </div>
        <span class="chip">${p.owner}</span>
      </div>`).join("")}</div>`).join("");
}

async function load() {
  try {
    const r = await fetch("/draft.json");
    if (!r.ok) throw new Error(r.status);
    picks = (await r.json()).picks;
    const owners = [...new Set(picks.map((p) => p.owner))].sort();
    $("#owner").insertAdjacentHTML("beforeend", owners.map((o) => `<option>${o}</option>`).join(""));
    render();
  } catch (e) {
    $("#rounds").innerHTML = `<div class="empty" style="color:var(--worst)">Couldn't load the draft. Try refreshing.</div>`;
  }
}
$("#owner").addEventListener("change", render);
load();
</script>
</body>
</html>
