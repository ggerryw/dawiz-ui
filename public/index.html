<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DaWiz</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <nav class="nav" id="nav"></nav>
  <header>
    <h1>DaWiz L</h1>
    <div class="sub" id="sub">Loading…</div>
  </header>
  <div class="card scroll">
    <table id="main">
      <thead>
        <tr class="grp"><th></th><th></th><th colspan="5" class="s5">Season</th><th colspan="4" class="s4">Season</th><th class="sep rmc"></th><th colspan="2" class="sep og-grp">Last night</th><th class="sep"></th></tr>
        <tr><th></th><th class="own">Owner</th><th>GP</th><th>G</th><th>A</th><th>TP</th><th class="pp">PPG</th><th class="sep rmc" title="Round money">RM</th><th class="sep og">GP</th><th>TP</th><th class="sep pt" title="Players with a game today">Playing Tonight</th></tr>
      </thead>
      <tbody id="body"></tbody>
    </table>
    <div id="err" hidden></div>
  </div>
  <div class="legend">
    <span><i style="background:var(--good)"></i>At or above avg</span>
    <span><i style="background:var(--bad)"></i>Below avg</span>  </div>
</main>
<script src="/common.js"></script>
<script>
const COLS = ["gp", "g", "a", "tp", "ppg"];
const money = (v) => `$${v.toFixed(2)}`;
const open = new Set();
let data;

function shade(owners) {
  const st = {};
  for (const c of [...COLS, "rm"]) {
    const v = owners.map((o) => o[c]);
    st[c] = { avg: v.reduce((a, b) => a + b, 0) / v.length, max: Math.max(...v), min: Math.min(...v) };
  }
  return (c, v) => {
    const s = st[c];
    return (v >= s.avg ? "good" : "bad") + (v === s.max ? " best" : v === s.min ? " worst" : "");
  };
}

// An open owner's roster table: active players, Total row, bench.
function rosterTable(o) {
  // Wide screens (.wd cells) split round, position, team and price into their own columns;
  // narrower screens show them in the line under the name instead.
  const prow = (p, cls = "") => {
    const onBench = cls === "bench";
    return `<tr class="${cls}"><td class="wd">${p.round ?? ""}</td><td class="pname"><a class="player" href="https://www.nhl.com/player/${p.id}" target="_blank" rel="noopener">${photo(p)}<div class="pinfo"><div class="nameline"><b>${p.name}</b>${gamePill(p.game)}</div><span class="pmeta">${logo(p.team)}${p.team ?? "—"} · ${p.pos}${p.round ? ` · Rd ${p.round}` : ""}${onBench ? ` · Times Picked: <span class="times">${p.timesPicked}</span>` : price(p.cost)}</span></div></a></td>
    <td class="wd">${p.pos}</td><td class="wd tm">${logo(p.team)}${p.team ?? "—"}</td>
    <td data-l="GP">${p.gp}</td><td data-l="G">${p.g}</td><td data-l="A">${p.a}</td><td data-l="TP"><b>${p.tp}</b></td><td data-l="PPG">${p.gp ? (p.tp / p.gp).toFixed(2) : "0.00"}</td>
    <td class="rm"${p.rm ? ' data-l="RM"' : ""}>${p.rm ? money(p.rm) : ""}</td><td class="wd">${onBench ? p.timesPicked : p.cost == null ? "" : money(p.cost)}</td><td class="ln"${p.otp ? ' data-l="Last Night:"' : ""}>${p.otp ? `<span class="plus">+${p.otp}</span>` : ""}</td></tr>`;
  };
  const cost = o.players.reduce((n, p) => n + (p.cost ?? 0), 0);
  const total = `<tr class="total"><td class="wd"></td><td class="pname"><b>Total</b></td><td class="wd"></td><td class="wd"></td>
    <td data-l="GP">${o.gp}</td><td data-l="G">${o.g}</td><td data-l="A">${o.a}</td><td data-l="TP">${o.tp}</td><td data-l="PPG">${o.ppg.toFixed(2)}</td>
    <td class="rm" data-l="RM">${money(o.rm)}</td><td class="wd">${money(cost)}</td><td class="ln"${o.otp ? ' data-l="Last Night:"' : ""}>${o.otp ? `<span class="plus">+${o.otp}</span>` : ""}</td></tr>`;
  // CSS can't change colspan, so the bench label row has a narrow version (8 columns) and a wide one (12).
  const bench = o.bench?.length
    ? `<tr class="benchhead nw"><td colspan="8">Bench</td></tr><tr class="benchhead wd"><td colspan="10">Bench</td><td>Times Picked</td><td></td></tr>${o.bench.map((p) => prow(p, "bench")).join("")}`
    : "";
  return `<table><thead><tr><th class="wd">Rd</th><th style="text-align:left">Player</th><th class="wd">Pos</th><th class="wd">Team</th><th>GP</th><th>G</th><th>A</th><th>TP</th><th>PPG</th><th title="Round money">RM</th><th class="wd">Cost</th><th class="ln">Last night</th></tr></thead><tbody>${o.players.map((p) => prow(p)).join("")}${total}${bench}</tbody></table>`;
}

function render() {
  const cls = shade(data.owners);
  const rows = data.owners.map((o, i) => {
    const cells = COLS.map((c) => `<td class="${cls(c, o[c])} ${c}">${c === "ppg" ? o[c].toFixed(2) : o[c]}</td>`).join("");
    const isOpen = open.has(o.owner);
    let html = `<tr class="row ${isOpen ? "open" : ""}" data-o="${o.owner}">
      <td class="rank">${i + 1}</td><td class="name"><span class="chev">▶</span>${o.owner}</td>${cells}<td class="sep rmc ${cls("rm", o.rm)}">${money(o.rm)}</td>
      <td class="sep og">${o.ogp}</td><td>${o.otp ? `<span class="plus">+${o.otp}</span>` : 0}</td>
      <td class="sep">${o.tonight}</td></tr>`;
    if (isOpen) {
      html += `<tr class="detail"><td colspan="11">${rosterTable(o)}</td></tr>`;
    }
    return html;
  });
  $("#body").innerHTML = rows.join("");
  const d = new Date(data.asOf + "T12:00:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  $("#sub").textContent = `As of ${d}`;
}

$("#body").addEventListener("click", (e) => {
  const r = e.target.closest("tr.row");
  if (!r) return;
  open.has(r.dataset.o) ? open.delete(r.dataset.o) : open.add(r.dataset.o);
  render();
});

async function load() {
  try {
    const r = await fetch("/api/standings");
    if (!r.ok) throw new Error(r.status);
    data = await r.json();
    $("#err").hidden = true;
    render();
  } catch (e) {
    $("#err").hidden = false;
    $("#err").textContent = "Couldn't load standings. Try refreshing.";
    $("#sub").textContent = "";
  }
}
load();
</script>
</body>
</html>
