<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DaWiz L</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <nav class="nav"><a href="/" aria-current="page">Standings</a><a href="/overnight.html">Overnight</a></nav>
  <header>
    <h1>DaWiz L</h1>
    <div class="sub" id="sub">Loading…</div>
  </header>
  <div class="card scroll">
    <table id="main">
      <thead>
        <tr class="grp"><th></th><th></th><th colspan="5">Season</th><th colspan="2" class="sep og-grp">Last night</th><th class="sep"></th></tr>
        <tr><th></th><th></th><th>GP</th><th>G</th><th>A</th><th>TP</th><th class="pp">PPG</th><th class="sep og">GP</th><th>TP</th><th class="sep" title="Players with a game today">Tonight</th></tr>
      </thead>
      <tbody id="body"></tbody>
    </table>
    <div id="err" hidden></div>
  </div>
  <div class="legend">
    <span><i style="background:var(--good)"></i>At or above avg</span>
    <span><i style="background:var(--bad)"></i>Below avg</span>
    <span><span class="dot" style="margin:0 5px 0 0"></span>Plays tonight</span>  </div>
</main>
<script src="/common.js"></script>
<script>
const COLS = ["gp", "g", "a", "tp", "ppg"];
const open = new Set();
let data;

function shade(owners) {
  const st = {};
  for (const c of COLS) {
    const v = owners.map((o) => o[c]);
    st[c] = { avg: v.reduce((a, b) => a + b, 0) / v.length, max: Math.max(...v), min: Math.min(...v) };
  }
  return (c, v) => {
    const s = st[c];
    return (v >= s.avg ? "good" : "bad") + (v === s.max ? " best" : v === s.min ? " worst" : "");
  };
}

function render() {
  const cls = shade(data.owners);
  const rows = data.owners.map((o, i) => {
    const cells = COLS.map((c) => `<td class="${cls(c, o[c])} ${c}">${c === "ppg" ? o[c].toFixed(2) : o[c]}</td>`).join("");
    const isOpen = open.has(o.owner);
    let html = `<tr class="row ${isOpen ? "open" : ""}" data-o="${o.owner}">
      <td class="rank">${i + 1}</td><td class="name"><span class="chev">▶</span>${o.owner}</td>${cells}
      <td class="sep og">${o.ogp}</td><td>${o.otp ? `<span class="plus">+${o.otp}</span>` : 0}</td>
      <td class="sep">${o.tonight}</td></tr>`;
    if (isOpen) {
      const prow = (p, cls = "") => `<tr class="${cls}"><td class="pname"><a class="player" href="https://www.nhl.com/player/${p.id}" target="_blank" rel="noopener">${photo(p)}<div class="pinfo"><b>${p.name}${p.tonight ? '<span class="dot" title="Plays tonight"></span>' : ""}</b><span class="pmeta">${logo(p.team)}${p.team ?? "—"} · ${p.pos}${p.round ? ` · Rd ${p.round}` : ""}</span></div></a></td>
        <td>${p.gp}</td><td>${p.g}</td><td>${p.a}</td><td><b>${p.tp}</b></td><td>${p.otp ? `<span class="plus">+${p.otp}</span>` : ""}</td></tr>`;
      const bench = o.bench?.length
        ? `<tr class="benchhead"><td colspan="6">Bench</td></tr>${o.bench.map((p) => prow(p, "bench")).join("")}`
        : "";
      html += `<tr class="detail"><td colspan="10"><table><thead><tr><th style="text-align:left">Player</th><th>GP</th><th>G</th><th>A</th><th>TP</th><th class="ln">Last night</th></tr></thead><tbody>${o.players.map((p) => prow(p)).join("")}${bench}</tbody></table></td></tr>`;
    }
    return html;
  });
  $("#body").innerHTML = rows.join("");
  const d = new Date(data.asOf + "T12:00:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  $("#sub").textContent = `As of ${d}`;
}

$("#body").addEventListener("click", (e) => {
  const r = e.target.closest("tr.row");
  if (!r) return;
  open.has(r.dataset.o) ? open.delete(r.dataset.o) : open.add(r.dataset.o);
  render();
});

async function load() {
  try {
    const r = await fetch("/api/standings");
    if (!r.ok) throw new Error(r.status);
    data = await r.json();
    $("#err").hidden = true;
    render();
  } catch (e) {
    $("#err").hidden = false;
    $("#err").textContent = "Couldn't load standings. Try refreshing.";
    $("#sub").textContent = "";
  }
}
load();
</script>
</body>
</html>
