<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DaWiz · Overnight</title>
<script>try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <nav class="nav" id="nav"></nav>
  <header>
    <h1>Overnight</h1>
    <div class="sub" id="sub">Loading…</div>
  </header>
  <div class="toolbar">
    <span id="summary"></span>
    <label class="toggle"><input type="checkbox" id="owned"> Rostered players only</label>
  </div>
  <div class="card" id="list"></div>
</main>
<script src="/common.js"></script>
<script>
let data;
const ownedOnly = $("#owned");

function render() {
  const all = data.scorers;
  const shown = ownedOnly.checked ? all.filter((s) => s.owners.length) : all;
  const scored = all.filter((s) => s.tp > 0).length;
  const owned = all.filter((s) => s.owners.length).length;
  $("#summary").textContent = `${scored} players with a point · ${owned} rostered players played`;
  $("#sub").textContent = new Date(data.date + "T12:00:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });

  // Season columns (.sz) only show on wide screens; the header row is wide-only too. The first two header cells are
  // empty placeholders for the photo and name columns.
  const head = `<div class="scorer head"><span></span><span></span>${["GP", "G", "A", "TP", "PPG"].map((h) => `<span class="sz">${h}</span>`).join("")}<span>Last night</span></div>`;
  $("#list").innerHTML = shown.length
    ? head + shown.map((s) => {
        const z = s.season;
        const chips = s.owners.map((o) => `<span class="chip">${o}</span>`).join("");
        return `<div class="scorer ${s.owners.length ? "owned" : ""}">
          <a href="https://www.nhl.com/player/${s.id}" target="_blank" rel="noopener">${photo(s)}</a>
          <div class="pinfo">
            <a class="player" href="https://www.nhl.com/player/${s.id}" target="_blank" rel="noopener"><b>${s.name}</b></a>
            <span class="pmeta">${logo(s.team)}${s.team} ${s.home ? "vs" : "@"} ${s.opp} · ${s.pos}</span>
            ${chips ? `<div class="chips">${chips}</div>` : ""}
          </div>
          <span class="sz">${z.gp}</span><span class="sz">${z.g}</span><span class="sz">${z.a}</span><span class="sz"><b>${z.tp}</b></span><span class="sz">${z.gp ? (z.tp / z.gp).toFixed(2) : "0.00"}</span>
          <div class="stat"><b>${s.tp}</b><span>${s.g}G ${s.a}A</span></div>
        </div>`;
      }).join("")
    : `<div class="empty">No scorers to show.</div>`;
}

ownedOnly.addEventListener("change", render);

async function load() {
  try {
    const r = await fetch("/api/overnight");
    if (!r.ok) throw new Error(r.status);
    data = await r.json();
    render();
  } catch (e) {
    $("#list").innerHTML = `<div class="empty" style="color:var(--worst)">Couldn't load overnight scorers. Try refreshing.</div>`;
    $("#sub").textContent = "";
  }
}
load();
</script>
</body>
</html>
